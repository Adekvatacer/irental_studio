<title>IRENTAL Studio — анімований логотип</title>

<style>
:root{--cream:#14100d;--cream2:#0b0907;--gold:#c9a24d;--burgundy:#d9c3b5;--ink:#e2bd6a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 50% 38%,var(--cream) 0%,var(--cream2) 100%);color:var(--burgundy);
  font-family:'Cormorant Garamond',Georgia,serif;display:grid;place-items:center;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .3  0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.wrap{position:relative;width:min(88vw,680px);display:flex;flex-direction:column;align-items:center;perspective:900px}
.stage{position:relative;width:100%;aspect-ratio:342/284;transition:transform .25s ease-out;transform-style:preserve-3d}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
canvas#dust{position:absolute;inset:-12%;width:124%;height:124%;pointer-events:none}
.halo{position:absolute;inset:-10%;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(226,190,106,.32),rgba(226,190,106,0) 70%);opacity:0;animation:halo 1.6s 1.9s ease-out forwards,breathe 6s 3.6s ease-in-out infinite}
@keyframes halo{to{opacity:1}}
@keyframes breathe{0%,100%{opacity:.75;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
.line{stroke:#caa44f;stroke-width:.55;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 2.4s cubic-bezier(.55,.1,.2,1) forwards,hide .9s 2.9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes hide{to{opacity:0}}
.fill{opacity:0;animation:fillin 1.8s 2.4s ease-out forwards;filter:drop-shadow(0 0 3px rgba(226,190,106,.55))}
@keyframes fillin{to{opacity:1}}
.title{margin-top:clamp(10px,2.4vw,26px);text-align:center;opacity:0;transform:translateY(10px);animation:rise 1.4s 2.6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.title h1{margin:0;font-family:'Marcellus',serif;font-weight:400;font-size:clamp(20px,4.6vw,38px);letter-spacing:.42em;padding-left:.42em;
  background:linear-gradient(100deg,#8d6a25 0%,#d9b25f 35%,#f6e3a1 50%,#d9b25f 65%,#8d6a25 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 7s 3.6s ease-in-out infinite}
@keyframes foil{0%{background-position:100% 0}60%,100%{background-position:-60% 0}}
.rule{display:flex;align-items:center;gap:14px;margin:12px auto 0;justify-content:center}
.rule i{display:block;height:1px;width:clamp(40px,10vw,90px);background:linear-gradient(90deg,transparent,var(--gold))}
.rule i:last-child{transform:scaleX(-1)}
.rule b{width:5px;height:5px;transform:rotate(45deg);background:var(--gold)}
.title p{margin:10px 0 0;font-size:clamp(15px,2.6vw,21px);letter-spacing:.28em;text-transform:lowercase;font-weight:400;color:var(--burgundy)}
.replay{position:fixed;right:18px;bottom:16px;background:none;border:1px solid color-mix(in srgb,var(--gold) 55%,transparent);color:var(--ink);
  font:500 13px 'Cormorant Garamond',serif;letter-spacing:.2em;text-transform:uppercase;padding:9px 16px;border-radius:999px;cursor:pointer;opacity:.7;transition:.25s}
.replay:hover{opacity:1;background:color-mix(in srgb,var(--gold) 14%,transparent)}
@media (prefers-reduced-motion:reduce){
 .line{display:none}.fill,.title,.halo{animation-duration:.01s;animation-delay:0s}.title h1{animation:none;color:var(--ink);-webkit-text-fill-color:currentColor}
}
</style>
</head>

const wrap=document.getElementById('wrap');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
let raf=0;

function build(){
  cancelAnimationFrame(raf);
  // монограма першою, потім тигр зліва направо
  // тигр — з трасування (обрізаний по лінії спини), літери I та R — чиста векторна графіка
  const P=DATA.paths.slice().sort((a,b)=>a.x-b.x);
  const all=P.map(p=>p.d).join('');
  // Літери в стилі Didone: тонкі волосяні засічки, контрастні штрихи, «інлайн»-ніжка в I.
  // Нижня частина літер розчиняється в золотих смугах спини тигра (маски fadeL / fadeT).
  const LET=[
    'M119 57.5H147V59H137V143.5H147V145.5H119V143.5H129V59H119ZM131.2 59H134.8V143.5H131.2Z',
    'M154 57.5H186C204 57.5 213 66 213 80C213 92 206 100 195 103.5L217 141H224V145.5H207L182 105H169V141H176V145.5H154V141H161V59H154ZM169 61H184C195 61 204 69 204 80C204 90 197 100 184 102H169Z'
  ];
  const letters=LET.join('');
  const dl=(d,t)=>`style="animation-delay:${t.toFixed(2)}s,${(t+2.5).toFixed(2)}s"`;
  const lines=`<g mask="url(#fadeL)">`+LET.map((d,i)=>`<path class="line" pathLength="1" ${dl(d,i*0.35)} d="${d}"/>`).join('')+`</g>`+
    `<g mask="url(#fadeT)">`+P.map((p,i)=>`<path class="line" pathLength="1" ${dl(p.d,0.5+i*0.045)} d="${p.d}"/>`).join('')+`</g>`;
  const sweepG=clip=>`<g clip-path="url(#${clip})"><g>
            <animateTransform attributeName="transform" type="translate" values="-140 0;${DATA.w+120} 0;${DATA.w+120} 0" keyTimes="0;.3;1" dur="6s" begin="3.1s" repeatCount="indefinite"/>
            <rect x="0" y="-40" width="70" height="${DATA.h+80}" fill="url(#sweep)" transform="skewX(-22)" style="mix-blend-mode:soft-light"/>
            <rect x="12" y="-40" width="22" height="${DATA.h+80}" fill="url(#sweep)" transform="skewX(-22)" opacity=".9"/>
          </g></g>`;
  wrap.innerHTML=`
  <div class="stage" id="stage">
    <div class="halo"></div>
    <svg viewBox="0 0 ${DATA.w} ${DATA.h}" role="img" aria-label="Логотип IRENTAL Studio: золотий тигр і монограма R">
      <defs>
        <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${DATA.w}" y2="${DATA.h}" spreadMethod="reflect">
          <stop offset="0" stop-color="#7d5a1b"/><stop offset=".18" stop-color="#c79a3f"/><stop offset=".34" stop-color="#f3dc92"/>
          <stop offset=".5" stop-color="#b8892c"/><stop offset=".68" stop-color="#e6c26e"/><stop offset=".84" stop-color="#9a6f22"/><stop offset="1" stop-color="#d8b358"/>
          <animateTransform attributeName="gradientTransform" type="translate" values="0 0;-120 -40;0 0" dur="9s" begin="1.6s" repeatCount="indefinite"/>
        </linearGradient>
        <linearGradient id="sweep" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fffbe9" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <!-- літери: повна яскравість зверху, розчиняються до спини тигра -->
        <linearGradient id="gL" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="152">
          <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <!-- тигр: смуги «проростають» зі спини, без різкого зрізу -->
        <linearGradient id="gT" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="162">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff"/>
        </linearGradient>
        <mask id="fadeL" maskUnits="userSpaceOnUse" x="0" y="0" width="${DATA.w}" height="${DATA.h}"><rect width="${DATA.w}" height="${DATA.h}" fill="url(#gL)"/></mask>
        <mask id="fadeT" maskUnits="userSpaceOnUse" x="0" y="0" width="${DATA.w}" height="${DATA.h}"><rect width="${DATA.w}" height="${DATA.h}" fill="url(#gT)"/></mask>
        <clipPath id="clipL"><path clip-rule="evenodd" d="${letters}"/></clipPath>
        <clipPath id="clipT"><path clip-rule="evenodd" d="${all}"/></clipPath>
      </defs>
      <g>${lines}</g>
      <g class="fill">
        <g mask="url(#fadeL)">
          <path fill="url(#gold)" fill-rule="evenodd" d="${letters}"/>
          ${sweepG('clipL')}
        </g>
        <g mask="url(#fadeT)">
          <path fill="url(#gold)" fill-rule="evenodd" d="${all}"/>
          ${sweepG('clipT')}
        </g>
      </g>
      <g visibility="hidden"><path id="mp" d="${letters}${all}"/></g>
    </svg>
    <canvas id="dust"></canvas>
  </div>
  <div class="title">
    <h1>IRENTAL STUDIO</h1>
    <div class="rule"><i></i><b></b><i></i></div>
    <p>оренда одягу</p>
  </div>`;
  tilt(); if(!REDUCED) dust();
}

/* золотий пил, що народжується на контурах логотипу */
function dust(){
  const cv=document.getElementById('dust'),mp=document.getElementById('mp');
  const dpr=Math.min(2,devicePixelRatio||1);let W,H;
  const size=()=>{const r=cv.getBoundingClientRect();W=cv.width=r.width*dpr;H=cv.height=r.height*dpr};size();
  const ctx=cv.getContext('2d');const L=mp.getTotalLength();
  const k=1.24, parts=[];
  const spawn=()=>{
    const pt=mp.getPointAtLength(Math.random()*L);
    const nx=(pt.x/DATA.w-.5)/k+.5, ny=(pt.y/DATA.h-.5)/k+.5;
    return {x:nx*W,y:ny*H,vx:(Math.random()-.5)*.18*dpr,vy:-(.12+Math.random()*.38)*dpr,
      r:(.5+Math.random()*1.5)*dpr,life:0,max:140+Math.random()*180,ph:Math.random()*6.28};
  };
  const t0=performance.now();
  (function loop(now){
    ctx.clearRect(0,0,W,H);
    const el=(now-t0)/1000;
    if(el>1.7){const rate=el<3.6?5:2;for(let i=0;i<rate;i++)if(parts.length<170)parts.push(spawn());}
    ctx.globalCompositeOperation='lighter';
    for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life++;p.x+=p.vx+Math.sin((p.life+p.ph*20)*.03)*.12*dpr;p.y+=p.vy;
      if(p.life>=p.max){parts.splice(i,1);continue}
      const a=Math.max(0,Math.sin(Math.PI*p.life/p.max)*(.55+.45*Math.sin(p.life*.18+p.ph)));
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
      g.addColorStop(0,`rgba(255,236,170,${a})`);g.addColorStop(.4,`rgba(222,178,86,${a*.5})`);g.addColorStop(1,'rgba(222,178,86,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r*4,0,6.283);ctx.fill();}
    raf=requestAnimationFrame(loop);
  })(t0);
}

/* м'який 3D-нахил за мишею */
function tilt(){
  const st=document.getElementById('stage');if(!st||REDUCED)return;
  const set=(x,y)=>st.style.transform=`rotateY(${x*7}deg) rotateX(${-y*5}deg)`;
  onpointermove=e=>set(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5);
}
document.getElementById('replay').onclick=build;
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')build()});
build();
</script>
